[platformio]
default_envs = esp32-c3-supermini

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_port = COM12
upload_speed = 921600
upload_port = COM12
board_build.flash_mode = dio
board_build.f_flash = 80000000L
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D OLED_CONTROLLER_SSD1306=1
    -D CORE_DEBUG_LEVEL=1

; Alternate controller for common 1.3-inch SH1106 modules:
; -D OLED_CONTROLLER_SH1106=1

[env:hardware-test]
extends = env:esp32-c3-supermini
build_flags =
    ${env:esp32-c3-supermini.build_flags}
    -D SOUNDDIAL_HARDWARE_TEST=1
